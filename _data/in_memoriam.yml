- name: Javier Pérez-Turiel
  photo: jpt.png
  info: Full professor, PhD Control Engineering
  paragraph: "<p>Javier Pérez Turiel, Full Professor of the University School, had a distinguished research career in the fields of biomedical engineering and medical robotics, focused on the development of intelligent technologies for clinical care. His main areas of research centered on neuromotor rehabilitation using bio-cooperative robots and on robotic-assisted surgery using collaborative systems. Over the course of more than three decades of research, he participated in numerous national and international projects in collaboration with multidisciplinary teams composed of engineers and healthcare professionals. He authored more than a hundred scientific publications and made a decisive contribution to the development of robotic assistance technologies for surgery and rehabilitation. Javier served on the committee responsible for creating and implementing the master's program in Biomedical Engineering at the University of Valladolid.</p><p>Beyond his research work, Javier stood out for his strong commitment to the scientific community. He was a very active member of the Spanish Committee on Automation, where he served as Coordinator of the Bioengineering Thematic Group, fostering collaboration among researchers and helping to strengthen this field within the CEA. His approachability, work ethic, and constant willingness to collaborate left a deep impression on all of us who were fortunate enough to share projects and initiatives with him.</p>"  
  datebirth: 15/11/1960
  datepassing: 08/07/2026

- name: Eusebio de la Fuente
  photo: imefl.png
  info: Associate professor, PhD Control Engineering
  paragraph: "<p>Eusebio de la Fuente López, Associate Professor of the University, built an extensive and distinguished career in the fields of computer vision, image processing, industrial machine vision, and robotics, later focusing his research on medical image processing, robotic surgery, and the application of artificial intelligence and deep learning techniques to the guidance of surgical robots. His research was always closely linked to the transfer of technologies to the industrial and healthcare sectors, contributing to the development of numerous machine vision systems applied to both industry and the biomedical fields.</p><p>Eusebio was also a professor who was extraordinarily committed to his students' education. Over the course of more than three decades of dedication to the university, he supervised a large number of senior projects, bachelor's theses, and master's theses; spearheaded initiatives for educational innovation; and promoted the internationalization of the School of Industrial Engineering as Associate Director of Mobility and International Relations at the School of Industrial Engineering in Valladolid. He always passed on his passion for engineering, computer vision, and research.</p>"
  datebirth: 17/08/1966
  datepassing: 22/06/2026

