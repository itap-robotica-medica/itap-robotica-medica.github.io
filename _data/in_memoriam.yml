- name: Javier Pérez-Turiel
  photo: jpt.png
  info: Associate professor, PhD Control Engineering
  paragraph: |-
    El profesor Javier Pérez Turiel, Catedrático de Escuela Universitaria, desarrolló una brillante trayectoria investigadora en el ámbito de la ingeniería biomédica y la robótica médica, orientada al desarrollo de tecnologías inteligentes para la asistencia clínica. Sus principales líneas de investigación se centraron en la rehabilitación neuromotora mediante robots biocooperativos y en la cirugía robótica asistida mediante sistemas colaborativos. A lo largo de más de tres décadas de actividad investigadora, participó en numerosos proyectos nacionales e internacionales en colaboración con equipos multidisciplinares formados por ingenieros y profesionales sanitarios. Fue autor de más de un centenar de publicaciones científicas y contribuyó decisivamente al desarrollo de tecnologías de asistencia robótica para cirugía y rehabilitación. Javier formó parte del comité que se encargó de la creación e implantación del máster en Ingeniería Biomédica en la Universidad de Valladolid.


    Más allá de su actividad investigadora, Javier destacó por su firme compromiso con la comunidad científica. Fue un miembro muy activo del Comité Español de Automática, donde desempeñó la responsabilidad de Coordinador del Grupo Temático de Bioingeniería, impulsando la colaboración entre investigadores y contribuyendo al fortalecimiento de este ámbito dentro del CEA. Su cercanía, capacidad de trabajo y disposición permanente para colaborar dejaron una profunda huella entre todos los que tuvimos la fortuna de compartir proyectos e iniciativas con él.  
  datebirth: 00-00-0000
  datepassing: 08/07/2026

- name: Eusebio de la Fuente
  photo: efl.jpg
  info: Associate professor, PhD Control Engineering
  paragraph: |- 
    El profesor Eusebio de la Fuente López, Profesor Titular de Universidad, desarrolló una extensa y reconocida trayectoria en el campo de la visión por computador, el procesamiento de imágenes, la visión artificial industrial y la robótica, orientando posteriormente su investigación hacia el procesamiento de imágenes médicas, la cirugía robótica y la aplicación de técnicas de inteligencia artificial y aprendizaje profundo al guiado de robots quirúrgicos. Su actividad investigadora estuvo siempre estrechamente vinculada a la transferencia de tecnología al tejido industrial y sanitario, contribuyendo al desarrollo de numerosos sistemas de visión artificial aplicados tanto a la industria como al ámbito biomédico.

 
    Eusebio fue, además, un profesor extraordinariamente comprometido con la formación de sus estudiantes. A lo largo de más de tres décadas de dedicación universitaria, dirigió un gran número de proyectos fin de carrera, trabajos fin de grado y fin de máster, impulsó iniciativas de innovación docente, promovió la internacionalización de la Escuela de Ingenierías Industriales como Subdirector de Movilidad y Relaciones Internacionales de la Escuela de Ingenierías Industriales de Valladolid.  Transmitió siempre su pasión por la ingeniería, la visión artificial y la investigación.
  datebirth: 00-00-0000
  datepassing: 22/06/2026

